<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            text-align: center;
            width: 400px;
        }

        th {
            width: 100px;
            padding: 10px;
            transition-duration: 0.5s;
        }

        th:hover {
            background-color: rgb(0, 0, 0);
            color: red;
            text-shadow: 1px 0px 10px red;
            padding: 20px;
            font-size: larger;
        }

        thead {
            border: 1px solid black;
            background-color: rgb(255, 73, 73);
            color: rgb(255, 255, 255);
        }

        thead > tr > th {
            border: 1px solid black;
        }

        tbody > tr > td, tfoot > tr > td {
            border: 1px solid black;
        }

        tbody > tr > td.alterado {
            background-color: rgb(255, 184, 184);
        }

        tbody > tr > td.naoalterado {
            background-color: white;
            transition-duration: 0.3s;
        }

        tbody > tr > td.naoalterado:hover {
            background-color: crimson;
            font-size: 20px;
            color: white;
            padding: 4px;
        }

        tfoot {
            border: 1px solid black;
            transition-duration: 0.5s;
        }

        tfoot > tr > td {
            background-color: rgb(255, 255, 255);
            transition-duration: 0.5s;
        }

        tfoot > tr > td:hover {
            background-color: rgb(255, 115, 0);
            font-size: 40px;
            text-shadow: 1px 0px 10px rgb(116, 46, 0);
            padding: 20px;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>A</th>
                <th>B</th>
                <th>C</th>
                <th>D</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="naoalterado">1</td>
                <td class="naoalterado">2</td>
                <td rowspan="2" class="alterado">3</td>
                <td class="naoalterado">4</td>
            </tr>
            <tr>
                <td class="naoalterado">5</td>
                <td class="naoalterado">6</td>
                <td class="naoalterado">7</td>
            </tr>
            <tr>
                <td colspan="3" class="alterado">8</td>
                <td class="naoalterado">9</td>
            </tr>
            <tr>
                <td rowspan="2" class="alterado">10</td>
                <td colspan="2" class="alterado">11</td>
                <td class="naoalterado">12</td>
            </tr>
            <tr>
                <td class="naoalterado">13</td>
                <td class="naoalterado">14</td>
                <td class="naoalterado">15</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total de células:</th>
                <td colspan="3">15</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
