<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png"> <!-- É necessário que esteja em ORDEM! -->
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png"> <!-- Adapta qual imagem vai carregar de acordo com o tamanho máximo ou mínimo (basta trocar por min-width ou max-width) -->
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
    <audio src="midia/happy-mistake.mp3" controls autoplay loop></audio> <!-- MP3 WAV OGG -->
    <audio preload="metadata"> <!-- O preload vem por padrão no auto, que basicamente só carrega o site depois que tiver carregado o áudio inteiro, o que é perigoso, portanto normalmente se usa metadata ou none que só carrega quando clicado. -->
        <source src="midia/happy-mistake.mp3" type="audio/mpeg"> <!-- A ordem importa, ele vai tentar rodar o áudio de cima para baixo na ordem que for posto, por isso coloque a mensagem de erro por último. -->
        <source src="midia/happy-mistake.ogg" type="audio/ogg">
        <source src="midia/happy-mistake.wav" type="audio/wav">
        <p>Infelizmente não pudemos reproduzir no seu navegador. <a href="midia/happy-mistake.mp3" download="midia/happy-mistake.mp3">Clique aqui para baixar o arquivo MP3</a>.</p>
    </audio>
</body>
</html>
