<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            /*
            Padrão: 
            flex-direction: row;
            flex-wrap: nowrap;
            */
            flex-flow: row wrap; /* Faz o mesmo que os dois separados, é como se fosse um shorthand, é a junção do direction com wrap. */
            /*
            Escrita separado: 
            flex-direction: row;
            flex-wrap: wrap;
            */
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;

            flex: auto; /* Faz com que caso ocorra o wrap após o limite do encolhimento de conteúdo, ele fique cobrindo todo espaço em branço. */
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
    </div>
</body>
</html>
