<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;

            display: flex; /* O display: flex; é APENAS no contêiner, pois é o pai.*/
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 400px;
        }

        div#cxA {
            flex-shrink: 1;
            flex-grow: 2; /* Para valores acima de 1, ele faz a soma do total de itens que usa o atributo, nesse caso só tem o cxB com flwx-grow 1, logo 2 desse + 1 do cxB = 3, divide o espaço em branco em 3 partes, e como esse tem 2, 2 terços do aumento é dele, o 1 terço que sobra fica pro cxB, o processo é o mesmo pro shrink. */
        }

        div#cxB {
            flex-shrink: 0;
            flex-grow: 1;
        }

        div#cxC {
            flex-shrink: 2;
            flex-grow: 0;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
