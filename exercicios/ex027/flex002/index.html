<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        /* Row */
        div.conteiner {
            background-color: lightsalmon;

            display: flex;
            flex-direction: row; /* Flex-direction é no contêiner. */
            margin-bottom: 10px;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }

        /* Row-reverse */
        div.conteiner2 {
            background-color: lightsalmon;
            

            display: flex;
            flex-direction: row-reverse;
            margin-bottom: 10px;
        }

        div.item2 {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }

        /* Column */
        div.conteiner3 {
            background-color: lightsalmon;

            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }

        div.item3 {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }

        /* Column-reverse */
        div.conteiner4 {
            background-color: lightsalmon;

            display: flex;
            flex-direction: column-reverse;
            margin-bottom: 10px;
        }

        div.item4 {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <h2>Row</h2>
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
    <div class="conteiner2">
        <h2>Row-reverse</h2>
        <div class="item2">A</div>
        <div class="item2">B</div>
        <div class="item2">C</div>
        <div class="item2">D</div>
        <div class="item2">E</div>
        <div class="item2">F</div>
        <div class="item2">G</div>
    </div>
    <div class="conteiner3">
        <h2>Column</h2>
        <div class="item3">A</div>
        <div class="item3">B</div>
        <div class="item3">C</div>
        <div class="item3">D</div>
        <div class="item3">E</div>
        <div class="item3">F</div>
        <div class="item3">G</div>
    </div>
    <div class="conteiner4">
        <h2>Column-reverse</h2>
        <div class="item4">A</div>
        <div class="item4">B</div>
        <div class="item4">C</div>
        <div class="item4">D</div>
        <div class="item4">E</div>
        <div class="item4">F</div>
        <div class="item4">G</div>
    </div>
</body>
</html>
