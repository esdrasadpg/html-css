<!DOCTYPE html> <!-- Define que é html -->
<html lang="pt-br"> <!-- Define a linguagem -->
<head> <!-- cabeça (área das configurações do site basicamente) -->
    <meta charset="UTF-8"> <!-- permite acentuação e etc -->
    <meta name="viewport"  content="width=device-width, initial-scale=1.0"> <!-- mostra que vai ocupar 100% da área da tela -->
    <title>Meu primeiro exercício.</title> <!-- título do site -->
</head> <!-- fechamento da cabeça -->
<body> <!-- corpo -->
    <h1>Olá, mundo.</h1> <!-- h1 = título -->
    <hr> <!-- hr = horizontalrow (linha) -->
    <p>Esse é o meu primeiro documento HTML! Estou muito feliz!</p> <!-- p = parágrafo -->
    <p>Este é um momento único! Estou criando um site!</p>
</body> <!-- fechamento do corpo -->
</html>
