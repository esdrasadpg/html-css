<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Semântica.</title>
</head>
<body>
    <p>Eu moro na <address>Rua dos Capixabas - 229 - Botafogo - RJ</address></p> <!-- O ponto aqui é que a semântica, ou seja, o significado em oposição à forma, foi mais levado a sério, ao invés de usar <u> que não possui significado, apenas forma para sublinhar, no HTML5 temos o <address> que semanticamente é mais intuitivo, ou seja, mostrará o endereço. Por isso, significa algo, PRO SITE É UM ENDEREÇO, não apenas um texto sublinhado como se usasse o <u>, por exemplo, nesse caso em celular poderia ser clicável levando ao Google Maps, O SITE ENTENDE, e não é apenas escrita personalizada. -->
</body>
</html>
