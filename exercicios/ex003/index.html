<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com imagens.</title>
</head>
<body>
    <h1>Testando carga e imagens.</h1>
    <p>Abaixo você vai ver uma imagem que está na mesma pasta.</p>
    <img src="logohtml5-200.png" alt="Logo HTML5"> <!-- 1. src = source (daonde vem a imagem), alt = texto alternativo (explica a imagem basicamente, para recursos de acessibilidade e etc. É importante que se haja um bom texto alternativo) 2. Segurar ctrl e apertar espaço mostra a lista de arquivos. -->
    <p>Podemos também carregar imagens de sub-pastas.</p>
    <img src="imagens/logocss-200.png" alt="Logo CSS3">
    <p>Também podemos carregar imagens externas.</p>
    <img src="https://bognarjunior.wordpress.com/wp-content/uploads/2018/01/1crcyaithv7aiqh1z93v99q.png" alt="Logo JavaScript"> 
</body>
</html>
