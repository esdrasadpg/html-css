<!DOCTYPE html>
<html lang="pt-br>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px; /* Controla a largura dos dados da tabela, a distância entre cada um horizontalmente. */
            height: 400px;
            border-collapse: collapse; /* Altera como as bordas se tocam ou não. Collapse = se tocam. */
        }

        td {
            border: 1px solid black; /* Põe borda em cada dado da tabela. */
            padding: 8px;
            text-align: center; /* Alinhamento horizontal dos dados. */
            vertical-align: top; /* Alinhamento vertical dos dados. (importante lembrar que não é center, é middle) */
        }

        .numero {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!-- Hierarquia de tabelas (simples): 
     
    TABLE = tabela
        TABLE ROW = linha de tabela
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dados de tabela -->
    <table>
        <tr> <!-- Table row, primeira linha (horizontal) -->
            <td>A1</td> <!-- Table data -->
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha">
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td class="dado">B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
