<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iFrame</title>
    <style>
        iframe { /* Mesmo que haja configurações de width e height no iframe, os do CSS se sobressaem. */
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iFrame</h1>
    <p>Acessando o site do <a href="https://www.cursoemvideo.com" target="_blank">CursoemVídeo</a> para aprender a programar.</p>

    <!-- Tamanho padrão de iframe: 300x150 -->
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scrolling='auto'> <!-- scrolling = controla a rolagem do iframe. -->
            <a href="https://www.cursoemvideo.com">Curso em Vídeo</a> <!-- Isso só vai aparecer se o navegador não for compatível com iframe. -->
        </iframe> 
        para aprender a programar.
    </p> <!-- iframe = inline frame (quadro em linha). -->
    <p>O site do <iframe src="https://www.google.com.br" frameborder="0"></iframe> também é muito legal.</p> <!-- Esse exemplo não funciona pois tem sites que possuem proteção contra iframes, como o google. -->
    <p>O repositório do Guanabara
        <iframe src="https://gustavoguanabara.github.io" frameborder="0">
            <a href="https://gustavoguanabara.github.io"> no GitHub</a>
        </iframe>
        também é bem legal.
    </p>
</body>
</html>
