<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iFrame</title>
</head>
<body>
    <h1>Testando o uso de um iFrame</h1>
    <p>Acessando o site do <a href="https://www.cursoemvideo.com" target="_blank">CursoemVídeo</a> para aprender a programar.</p>

    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com" frameborder="0"></iframe> para aprender a programar.</p> <!-- iframe = inline frame (quadro em linha). -->
    <p>O site do <iframe src="https://www.google.com.br" frameborder="0"></iframe></p> <!-- Esse exemplo não funciona pois tem sites que possuem proteção contra iframes, como o google. -->
</body>
</html>
