<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha.</h1>
    <hr>
    <p> <!-- Independente de escrever na mesma linha, quebrado, com espaço, e etc, sempre vai sair formatado reto normalmente no parágrafo. -->
        Você pode escrever 
        um parágrafo de qualquer jeito. 
        
        Basta colocar tudo 
        no meio do par de tags 
        &lt;p&gt; e &lt;/p&gt; <!-- &lt; e &gt; = inserem < e > no texto aparecido no site sem transformar o que foi escrito numa tag. (lt = less than, gt = greater than) -->
    </p>
    <p>
        Se precisar quebrar
        o texto em alguma lugar 
        específico <br> como esse, <!-- br = breakrow (quebra de linha) -->
        você pode usar a tag &lt;br&gt;.
    </p>
    <p>
        Vamos adicionar alguns símbolos especiais:

        &reg; <!-- Marca registrada -->
        &copy; <!-- Copyright -->
        &trade; <!-- Trademark -->
        &euro; <!-- Euro -->
        &pound; <!-- Libra (pound) -->
        &yen; <!-- Yen -->
        &cent; <!-- Cents -->
        &delta; <!-- delta minúsculo -->
        &Delta; <!-- Delta maiúsculo -->
        &uparrow; <!-- Seta pra cima, pode ser feito como &uarr; também (mesma coisa pra todas setas) -->
    </p>
</body>
</html>
