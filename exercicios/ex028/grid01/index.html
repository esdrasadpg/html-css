<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Prática</title>
    <style>
        div.container {
            border: 3px solid blue;
            height: 250px;
            display: grid; /* Necessário pôr no pai. */

            grid-template-columns: auto auto auto; /*  Controla a quantidade de colunas do grid, nesse caso serão 3.*/
            grid-template-rows: auto auto auto; /*  Controla a quantidade de linhas do grid, nesse caso serão 3.*/
            gap: 50px; /*  Controla o espaço entre cada item do container.*/
        }

        div.item {
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
