<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Prática</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        body {
            display: flex;
            flex-flow: row wrap;
            
        }
        
        div.item {
            border: 3px solid red;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        div.container {
            border: 3px solid blue;
            height: 250px;
            width: 250px;
            display: grid;
            margin: 10px;

            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;

            align-items: stretch;
            align-content: stretch;
            justify-items: stretch;
            justify-content: stretch;

            transition-duration: 0.5s;
        }

        div.container2 {
            border: 3px solid blue;
            height: 250px;
            width: 250px;
            display: grid;
            margin: 10px;

            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;

            align-items: start;
            align-content: start;
            justify-items: start;
            justify-content: start;

            transition-duration: 0.5s;
        }

        div.container3 {
            border: 3px solid blue;
            height: 250px;
            width: 250px;
            display: grid;
            margin: 10px;

            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;

            align-items: end;
            align-content: end;
            justify-items: end;
            justify-content: end;

            transition-duration: 0.5s;
        }

        div.container4 {
            border: 3px solid blue;
            height: 250px;
            width: 250px;
            display: grid;
            margin: 10px;

            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;

            align-items: center;
            align-content: center;
            justify-items: center;
            justify-content: center;

            transition-duration: 0.5s;
        }

        div.container5 {
            border: 3px solid blue;
            height: 250px;
            width: 250px;
            display: grid;
            margin: 10px;

            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;

            align-items: space-between;
            align-content: space-between;
            justify-items: space-between;
            justify-content: space-between;

            transition-duration: 0.5s;
        }

        div.container6 {
            border: 3px solid blue;
            height: 250px;
            width: 250px;
            display: grid;
            margin: 10px;

            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;

            align-items: space-evenly;
            align-content: space-evenly;
            justify-items: space-evenly;
            justify-content: space-evenly;

            transition-duration: 0.5s;
        }

        div.container7 {
            border: 3px solid blue;
            height: 250px;
            width: 250px;
            display: grid;
            margin: 10px;

            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;

            align-items: space-around;
            align-content: space-around;
            justify-items: space-around;
            justify-content: space-around;

            transition-duration: 0.5s;
        }

        div.container:hover, div.container2:hover, div.container3:hover, div.container4:hover, div.container5:hover, div.container6:hover, div.container7:hover {
            height: 500px;
            width: 500px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; width: 100vw; height: 80px; padding: 10px; color: red;">Propriedades para align-items, align-content, justify-items, justify-content</h1>
    <div>
        <h1>stretch</h1>
        <div class="container">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
            <div class="item">H</div>
            <div class="item">I</div>
        </div>
    </div>
    <div>
        <h1>start</h1>
        <div class="container2">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
            <div class="item">H</div>
            <div class="item">I</div>
        </div>
    </div>
    <div>
        <h1>end</h1>
        <div class="container3">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
            <div class="item">H</div>
            <div class="item">I</div>
        </div>
    </div>
    <div>
        <h1>center</h1>
        <div class="container4">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
            <div class="item">H</div>
            <div class="item">I</div>
        </div>
    </div>
    <div>
        <h1>space-between</h1>
        <div class="container5">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
            <div class="item">H</div>
            <div class="item">I</div>
        </div>
    </div>
    <div>
        <h1>space-evenly</h1>
        <div class="container6">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
            <div class="item">H</div>
            <div class="item">I</div>
        </div>
    </div>
    <div>
        <h1>space-around</h1>
        <div class="container7">
            <div class="item">A</div>
            <div class="item">B</div>
            <div class="item">C</div>
            <div class="item">D</div>
            <div class="item">E</div>
            <div class="item">F</div>
            <div class="item">G</div>
            <div class="item">H</div>
            <div class="item">I</div>
        </div>
    </div>

</body>
</html>
